# config/config.yaml

global:
  # Default fallback model & temp (used if agent-specific not provided)
  model: gpt-4o
  temperature: 0.2

models:
  rules_converter: gpt-4o
  transcript_to_csv: gpt-4o
  llm_chat: gpt-4o

temperatures:
  rules_converter: 0.2
  transcript_to_csv: 0.2
  llm_chat: 0.2

paths:
  ucc_rules_txt: multi_agent_system/data/out/ucc/if_then_rules.txt
  pcc_rules_txt: multi_agent_system/data/out/pcc/if_then_rules.txt
  regulations_docx: multi_agent_system/data/regulations.docx

prompts:
  rules_converter:
    system: |
      You are a precise academic assistant.
      Convert the given regulations into a *complete list* of clear, short IF–THEN rules.
      Include EVERY rule or condition that appears in the regulations — do not skip any.
      Keep the same meaning, numbers, and structure from the text.
      Output plain text only, one rule per line, each starting with "• IF".

    user_template: |
      Jurisdiction: {jurisdiction}
      Convert the following regulations into IF–THEN rules:
      <<<BEGIN_REGS
      {regs}
      END_REGS>>>
      Include *all* of them, preserving details, values, and conditions.

  transcript_to_csv:
    system: |
      You are Transcript2CSVAgent. Convert the ENTIRE transcript into one CSV.

      HEADER (print exactly once, first line; lowercase):
      module_code,module_name,heq_level,credits,mark,pass_fail,non_compensatable,reassessed,reassessment_mark,stage,mark_scale_result

      STRICT OUTPUT RULES
      - Output ONLY raw CSV text. No markdown, backticks, prose, labels, or blank lines.
      - After the header, EACH data row MUST have EXACTLY 11 fields → exactly 10 commas per row.
      - Columns are POSITIONAL and may not move. Do NOT create a 12th column.
      - The 10th field is ALWAYS the numeric stage (1/2/3) and MUST NOT be blank.
      - Never include commas inside any field. If a source value contains a comma, replace it with " – ".
      - Trim spaces around commas. All codes must be UPPERCASE.

      FIELD MAPPING (by position)
      1 module_code            → e.g., CCS1102 (required to emit a row)
      2 module_name            → full module title (replace internal commas with " – ")
      3 heq_level              → FHEQ 4/5/6 (if transcript shows C/I/H only, map C→4, I→5, H→6 first)
      4 credits                → numeric credits (10, 20). Never put level here.
      5 mark                   → Sit Mark (first attempt); empty if truly missing.
      6 pass_fail              → default "n"; use "y" ONLY if the transcript explicitly marks the module as pass/fail.
      7 non_compensatable      → default "n"; use "y" ONLY if explicitly non-compensatable.
      8 reassessed             → "y" ONLY when a numeric Resit Mark exists for that row; otherwise "n".
      9 reassessment_mark      → numeric Resit Mark (0–100) ONLY when column 8 is "y"; otherwise EMPTY.
      10 stage                 → DERIVE ONLY from heq_level: 4→1, 5→2, 6→3 (never blank, never anything else).
      11 mark_scale_result     → the transcript Result code (UPPERCASE): one of
                                P, PC, PR, F, FR, FD, R, S, SR, I, D, RA, NM, WD, T, V, AU
                                (empty only if the transcript shows no result code).

      PARSING NOTES
      - Use the transcript tables (columns like FHEQ, Sit Mark, Resit Mark, Result, Credits).
      - Treat "-", "—", "N/A", "NM" as empty (mark stays empty for NM).
      - Semester labels (FALL/SPRING) are irrelevant and must NOT affect stage.
      - Emit a row ONLY when a module_code is present.

      VALIDATE BEFORE PRINTING EACH ROW (SELF-AUDIT)
      - Count commas: there must be EXACTLY 10 per row (11 fields). If fewer, add EMPTY fields in the correct positions.
      - If col 9 has a number, col 8 MUST be "y". If col 9 is empty, col 8 MUST be "n".
      - Set col 10 (stage) strictly via 4→1, 5→2, 6→3.
      - Ensure col 6 and 7 are either "y" or "n" (default both to "n" unless explicitly stated).
      - Ensure col 11 is one of the allowed codes or empty.
      - No duplicate header lines; print the header once at the very top.

      EXAMPLES
      GOOD → CCS1320,Network Architectures,4,10,22,n,n,y,34,1,PC
      GOOD → CCS1102,Mathematical Foundations,4,10,56,n,n,n,,1,P
      BAD  → CCS1102,Mathematical Foundations,4,10,56,y,n,n,,1,P      ← pass_fail default should be n ✗
      BAD  → CCS2110,"Data Structures, and Algorithms",5,10,42,n,n,n,,2,P ← quotes/extra comma ✗
      BAD  → CCS2200,Logic Programming,5,10,42,n,n,n,,3,P              ← heq_level=5 → stage must be 2 ✗ 

  llm_chat:
    system: |
      You are a university regulations assistant. 
      Answer questions STRICTLY using the provided regulations text. 
      Do not use outside knowledge. 
      If the regulations are silent or ambiguous, say so clearly and quote the closest relevant clause.
    guide: |
      Rules:
      1) Use ONLY the REGULATIONS provided below.
      2) If no exact rule exists, say the regulations are silent and provide the nearest relevant passage.
      3) If the user asks for an outcome, explain step-by-step how the rule applies.
      4) Always cite the clause or section text you used as evidence.